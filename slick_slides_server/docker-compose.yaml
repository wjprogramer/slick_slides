version: '3.7'

services:
  postgres:
    image: postgres:16.3
    ports:
      - '8090:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: slick_slides
      POSTGRES_PASSWORD: "cmnfY1oeIUPjn4WEeNdMNxz-tTq4QPGB"
    volumes:
      - slick_slides_data:/var/lib/postgresql/data
  redis:
    image: redis:6.2.6
    ports:
      - '8091:6379'
    command: redis-server --requirepass "sFX5qSfHPZQm44-yl0iY3mTzAVmFmVw7"
    environment:
      - REDIS_REPLICATION_MODE=master
volumes:
  slick_slides_data:
